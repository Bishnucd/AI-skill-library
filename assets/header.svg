<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#05070f" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatParticle1 {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(30px, -20px); opacity: 0.8; }
        100% { transform: translate(0, 0); opacity: 0.2; }
      }
      @keyframes floatParticle2 {
        0% { transform: translate(0, 0); opacity: 0.3; }
        50% { transform: translate(-25px, 25px); opacity: 0.9; }
        100% { transform: translate(0, 0); opacity: 0.3; }
      }
      @keyframes floatParticle3 {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { transform: translate(20px, 30px); opacity: 0.7; }
        100% { transform: translate(0, 0); opacity: 0.2; }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.25; }
      }
      @keyframes beamScan {
        0% { transform: translateX(-100%); opacity: 0; }
        30% { opacity: 0.6; }
        70% { opacity: 0.6; }
        100% { transform: translateX(100%); opacity: 0; }
      }
      .p1 { animation: floatParticle1 6s ease-in-out infinite; }
      .p2 { animation: floatParticle2 8s ease-in-out infinite; }
      .p3 { animation: floatParticle3 7s ease-in-out infinite; }
      .grid-pattern { animation: pulseGrid 4s ease-in-out infinite; }
      .scanline { animation: beamScan 5s linear infinite; }
    </style>
  </defs>

  <!-- Card Background with Rounded Edges and Border -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="240" rx="16" fill="url(#centerAura)" />

  <!-- Background Animated Digital Grid / Grain Dots -->
  <g class="grid-pattern" fill="#38bdf8">
    <circle cx="80" cy="40" r="1.5" /><circle cx="160" cy="40" r="1.5" /><circle cx="240" cy="40" r="1.5" />
    <circle cx="320" cy="40" r="1.5" /><circle cx="400" cy="40" r="1.5" /><circle cx="480" cy="40" r="1.5" />
    <circle cx="560" cy="40" r="1.5" /><circle cx="640" cy="40" r="1.5" /><circle cx="720" cy="40" r="1.5" />
    <circle cx="800" cy="40" r="1.5" /><circle cx="80" cy="100" r="1.5" /><circle cx="160" cy="100" r="1.5" />
    <circle cx="720" cy="100" r="1.5" /><circle cx="800" cy="100" r="1.5" /><circle cx="80" cy="160" r="1.5" />
    <circle cx="160" cy="160" r="1.5" /><circle cx="720" cy="160" r="1.5" /><circle cx="800" cy="160" r="1.5" />
    <circle cx="80" cy="200" r="1.5" /><circle cx="160" cy="200" r="1.5" /><circle cx="240" cy="200" r="1.5" />
    <circle cx="320" cy="200" r="1.5" /><circle cx="400" cy="200" r="1.5" /><circle cx="480" cy="200" r="1.5" />
    <circle cx="560" cy="200" r="1.5" /><circle cx="640" cy="200" r="1.5" /><circle cx="720" cy="200" r="1.5" />
    <circle cx="800" cy="200" r="1.5" />
  </g>

  <!-- Dynamic Constellation Network (Animated Floating Nodes) -->
  <g class="p1">
    <circle cx="140" cy="80" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="220" cy="130" r="2.5" fill="#818cf8" />
    <line x1="140" y1="80" x2="220" y2="130" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3,3" />
  </g>

  <g class="p2">
    <circle cx="760" cy="90" r="3.5" fill="#c084fc" filter="url(#neonGlow)" />
    <circle cx="680" cy="140" r="2.5" fill="#38bdf8" />
    <line x1="760" y1="90" x2="680" y2="140" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3,3" />
  </g>

  <g class="p3">
    <circle cx="450" cy="35" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="350" cy="60" r="2" fill="#818cf8" />
    <circle cx="550" cy="60" r="2" fill="#c084fc" />
  </g>

  <!-- Top Badge: Community Standard -->
  <g transform="translate(325, 42)">
    <rect width="250" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">780 VERIFIED SKILLS • 20 DOMAINS</text>
  </g>

  <!-- Main Hero Title -->
  <text x="450" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="url(#glowGrad)" filter="url(#neonGlow)">
    AI SKILL LIBRARY
  </text>

  <!-- Sleek Tagline -->
  <text x="450" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The Universal Standard Library for AI Agents, Desktop &amp; Mobile Applications
  </text>

  <!-- Bottom Interactive Capability Pills -->
  <g transform="translate(180, 188)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="125" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="62" y="17" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">⚡ Zero Synthetic</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="125" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="202" y="17" text-anchor="middle" fill="#818cf8" font-family="monospace" font-size="11" font-weight="600">🔒 100% Tested</text>

    <!-- Pill 3 -->
    <rect x="280" y="0" width="125" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="342" y="17" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600">🤝 Open for PRs</text>

    <!-- Pill 4 -->
    <rect x="420" y="0" width="125" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="482" y="17" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">🌐 All LLM Agents</text>
  </g>
</svg>
